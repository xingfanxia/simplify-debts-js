<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Untangle shared expenses into a clean repayment plan. Private, fast, and entirely in your browser."
    />
    <meta id="theme-color" name="theme-color" content="#f4f1e8" />
    <script>
      (() => {
        let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        try {
          const storedTheme = localStorage.getItem('settle-theme')
          if (storedTheme === 'light' || storedTheme === 'dark') theme = storedTheme
        } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('#theme-color').content = theme === 'dark' ? '#101511' : '#f4f1e8'
      })()
    </script>
    <link rel="icon" href="/app-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Settle — make shared expenses simple</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
